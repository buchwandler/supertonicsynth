name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[cpu,dev]"
      - name: Resolve GPU extra metadata
        run: python -m pip install --dry-run ".[gpu]"
      - run: pytest
      - run: ruff check .
      - run: mypy
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python docs/make.py html
      - run: sphinx-build -W -b html docs docs/_build/html
  build:
    needs: [release-tests, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify release wheel
        run: |
          python - <<'PY'
          from email import message_from_bytes
          from pathlib import Path
          import os
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("supertonicsynth-*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              metadata_path = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              metadata = message_from_bytes(wheel.read(metadata_path))
              tag = os.environ["GITHUB_REF_NAME"]
              assert tag.startswith("v"), tag
              expected_version = tag[1:]
              assert metadata["Version"] == expected_version, metadata["Version"]
              required = {
                  "supertonicsynth/data/voice_level_calibration.json",
                  "supertonicsynth/py.typed",
              }
              assert required <= names, f"missing wheel files: {required - names}"
              licenses = {
                  Path(name).name
                  for name in names
                  if ".dist-info/licenses/" in name
              }
              required_licenses = {"LICENSE", "NOTICE", "SUPERTONIC-PY-MIT.txt"}
              assert required_licenses <= licenses, (
                  f"missing license files: {required_licenses - licenses}"
              )
          print(f"Verified wheel version {expected_version} and release contents")
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv .release-venv
          wheel="$(find dist -maxdepth 1 -name 'supertonicsynth-*.whl' -print -quit)"
          .release-venv/bin/python -m pip install "${wheel}[cpu]"
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" .release-venv/bin/python -c \
            'import os, supertonicsynth; assert supertonicsynth.__version__ == os.environ["EXPECTED_VERSION"]'
          .release-venv/bin/supertonicsynth --help
          .release-venv/bin/python - <<'PY'
          import sys
          import supertonicsynth as api
          from supertonicsynth import (
              AtomicSynthesisResult,
              DescribedVoice,
              DiscoveredModel,
              GenerationConfig,
              RequestApiContract,
              RequestMeasure,
              SynthesisInputTooLongError,
              SynthesisRequest,
              VoiceLevelConfig,
              request_api_contract,
              runtime_identity,
          )

          required = (
              "SupertonicRuntime",
              "SynthesisRequest",
              "GenerationConfig",
              "AtomicSynthesisResult",
              "RequestMeasure",
              "SynthesisInputTooLongError",
              "VoiceLevelConfig",
              "DiscoveredModel",
              "discover_models",
              "runtime_identity",
              "REQUEST_API_VERSION",
              "RequestApiContract",
              "request_api_contract",
          )
          for name in required:
              assert getattr(api, name) is not None, name

          assert api.REQUEST_API_VERSION == 1
          assert callable(api.SupertonicRuntime.from_pretrained)
          assert callable(api.SupertonicRuntime.measure_request)
          assert callable(api.SupertonicRuntime.synthesize)
          assert callable(api.SupertonicRuntime.close)
          contract = request_api_contract()
          assert isinstance(contract, RequestApiContract)
          assert contract.version == 1
          assert contract.request_type is SynthesisRequest
          assert contract.result_type is AtomicSynthesisResult
          assert contract.runtime_type is api.SupertonicRuntime
          assert contract.synthesis_method == "synthesize"
          assert contract.measurement_method == "measure_request"
          assert contract.discovery_method == "discover_models"
          assert contract.runtime_identity_method == "runtime_identity"
          assert contract.caller_owns_text_boundaries is True
          assert contract.supports_request_measurement is True
          assert contract.supports_named_voices is True
          assert contract.supports_voice_level is True
          assert contract.supports_reference_voice is False
          assert contract.supports_linguistic_tokens is False
          assert contract.supports_pronunciation_overrides is False
          assert contract.supports_whole_request_phonemes is False
          assert contract.supports_speakers is False
          assert contract.supports_word_timings is False
          SynthesisRequest(id="wheel-smoke", text="No model loaded.", language="en")
          GenerationConfig()
          RequestMeasure(amount=1, maximum=None)
          voice = DescribedVoice(id="F1", languages=("en",))
          model = DiscoveredModel(
              id="wheel-model",
              ref="supertonic:wheel-model",
              display_name="Wheel model",
              version=None,
              sample_rate=44100,
              aliases=(),
              languages=("en",),
              voices=(voice,),
              default_voice="F1",
              source_revision=None,
              max_input_tokens=None,
          )
          assert runtime_identity(model)["request_api_version"] == "1"
          assert "onnxvoice" not in sys.modules
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          attestations: false
