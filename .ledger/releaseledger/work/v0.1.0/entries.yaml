entries:
  - kind: added
    summary: Added the SupertonicSynth synthesis package with text chunking, voice and language selection, WAV output, and a CLI
    body:
      "SupertonicRuntime wraps the OnnxVoice supertonic adapter for text synthesis with
      per-language conditioning, semantic voice refs, deterministic chunking, request-level
      output gain, and synthesis metadata. Ships Apache-2.0 licensing, VCS-based packaging,
      typed errors, examples, and a synthesize/voices CLI."
    status: accepted
    source_refs:
      - git:70688c003a35e495cde226ecee118d4ebb3b911f
