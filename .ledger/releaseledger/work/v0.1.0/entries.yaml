  - kind: added
    summary: Added static voice level calibration with catalog or explicit dB gain, peak normalization, and voice level metadata
    body:
      "VoiceLevelConfig selects an offline calibrated static gain per semantic voice ref
      and language, with an explicit dB override taking precedence. Peak normalization and
      request-level output gain stay separate controls. Includes the counting benchmark and
      reviewed promotion tooling; the packaged catalog ships empty in this release."
    status: accepted
